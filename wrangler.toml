#:schema node_modules/wrangler/config-schema.json
name = "lunatv"
main = "./cloudflare-worker.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
minify = true

# 静态资源（Next 的 .next/static、public 等由 OpenNext 汇总到 .open-next/assets）
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1：先在控制台或 `wrangler d1 create lunatv` 创建，再把 database_id 填进来
[[d1_databases]]
binding = "DB"
database_name = "lunatv"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 每日刷新收藏 / 直播源，和原 vercel.json 的 "0 1 * * *" 对齐
[triggers]
crons = ["0 1 * * *"]

# 运行时变量（NEXT_PUBLIC_* 仍需在构建时注入，见 package.json 的 build:cloudflare）
[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"
NEXT_PUBLIC_STORAGE_TYPE = "d1"
